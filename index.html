<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>FIREMAP — weryfikacja</title><style>html,body{height:100%;margin:0;background:#07111f;color:white;font-family:Inter,system-ui,Segoe UI,Arial}.wrap{height:100%;display:grid;place-items:center;text-align:center}.logo{font-size:28px;font-weight:900}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#22c55e;margin-right:8px}.msg{color:#94a3b8;margin-top:8px}</style></head><body><div class="wrap"><div><div class="logo"><span class="dot"></span>FIREMAP</div><div class="msg" id="msg">Weryfikacja dostępu…</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=supabase.createClient('https://vqgipvwcvbhabvfipodl.supabase.co','sb_publishable_BYEVImorGhltw1aCaRXyRQ_pM2hKMkI',{auth:{persistSession:true,autoRefreshToken:true}});try{const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('./login.html');return}const {data:acc,error}=await sb.from('firemap_accounts').select('role,unit_name,enabled').eq('user_id',session.user.id).maybeSingle();if(error||!acc?.enabled){await sb.auth.signOut();location.replace('./login.html');return}localStorage.setItem('firemapVerifiedUnit',acc.unit_name||'');localStorage.setItem('firemapVerifiedRole',acc.role||'UNIT');location.replace(acc.role==='SK'?'./dispatcher.html':'./vehicle.html')}catch(e){document.getElementById('msg').textContent='Nie udało się zweryfikować dostępu. Przekierowanie do logowania…';setTimeout(()=>location.replace('./login.html'),1000)}})();</script></body></html>
