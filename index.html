<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#8b0000"><title>Mapa pojazdów — Radomsko</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>html,body{height:100%;margin:0;font-family:system-ui,Segoe UI,Arial;background:#0b1220;color:#fff}*{box-sizing:border-box}#app{height:100%;display:grid;grid-template-rows:58px 1fr}header{background:#8f1d1d;display:flex;align-items:center;padding:0 16px;font-weight:700;font-size:20px}#status{margin-left:auto;background:#166534;padding:8px 12px;border-radius:999px;font-size:14px}.layout{min-height:0;display:grid;grid-template-columns:390px 1fr}.side{padding:14px;background:#111827;overflow:auto;border-right:1px solid #334155}.card{background:#1f2937;border:1px solid #475569;border-radius:14px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px}.muted{color:#cbd5e1;font-size:14px}.ok{color:#6ee7b7}.warn{color:#fbbf24}.err{color:#fca5a5}button,input,select{width:100%;min-height:46px;border-radius:10px;font-size:16px}button{border:0;background:#e52428;color:#fff;font-weight:700;margin-top:10px;cursor:pointer}button.secondary{background:#475569}button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{background:#111827;color:#fff;border:1px solid #64748b;padding:8px 10px}label{display:block;margin:9px 0 4px;color:#cbd5e1;font-size:13px}#map{width:100%;height:100%;min-width:0;min-height:0;position:relative}.leaflet-container{width:100%;height:100%;overflow:hidden;position:relative;background:#ddd}.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-tile{width:256px;height:256px;max-width:none!important;max-height:none!important;padding:0;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}.leaflet-control{position:relative;z-index:800;pointer-events:auto}.vehicle{padding:8px 0;border-bottom:1px solid #475569}.vehicle:last-child{border-bottom:0}dialog{width:min(92vw,460px);border:1px solid #475569;border-radius:14px;background:#111827;color:#fff;padding:0}dialog::backdrop{background:#000b}dialog .body{padding:18px}@media(max-width:760px){#app{grid-template-rows:56px 1fr}.layout{grid-template-columns:1fr;grid-template-rows:55% 45%}#map{order:1}.side{order:2;border-right:0;border-top:1px solid #334155}header{font-size:15px}}</style></head><body><div id="app"><header>🚒 Mapa pojazdów — Radomsko i okolice <span id="status">łączenie…</span></header><div class="layout"><aside class="side"><div class="card"><h3>Twój pojazd</h3><div id="mine" class="muted">Nie połączono.</div><button id="join">Połącz / udostępnij pozycję</button><button id="stop" class="secondary" disabled>Zatrzymaj udostępnianie</button></div><div class="card"><h3>Aktywne pojazdy <span id="count">(0)</span></h3><div id="vehicles" class="muted">Brak aktywnych pojazdów.</div></div><div class="card"><h3>Serwer</h3><div id="server" class="muted">Sprawdzanie…</div></div><div class="card muted">Pozycja jest publikowana dopiero po kliknięciu „Połącz”. Pojazd bez aktualizacji przez 3 minuty znika z listy aktywnych.</div></aside><div id="map"></div></div></div><dialog id="dlg"><div class="body"><h2>Połącz pojazd</h2><label>Nazwa jednostki</label><input id="unit" placeholder="np. OSP Kamieńsk"><label>Numer operacyjny</label><input id="call" placeholder="np. 511-25"><label>Rodzaj samochodu</label><select id="type"><option>GBA</option><option>GCBA</option><option>SD</option><option>SLRt</option><option>SLOp</option><option>INNY</option></select><div class="row"><button id="cancel" class="secondary">Anuluj</button><button id="go">Uruchom GPS</button></div><div id="msg" class="muted"></div></div></dialog><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const URL='https://vqgipvwcvbhabvfipodl.supabase.co',KEY='sb_publishable_BYEVImorGhltw1aCaRXyRQ_pM2hKMkI',MAX=180000,BOUNDS=L.latLngBounds([[50.70,18.70],[51.40,20.25]]),$=id=>document.getElementById(id);const map=L.map('map',{maxBounds:BOUNDS.pad(.05),minZoom:8}).setView([51.067,19.445],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);L.rectangle(BOUNDS,{weight:1,fill:false,dashArray:'6,6'}).addTo(map);setTimeout(()=>map.invalidateSize(),150);addEventListener('resize',()=>map.invalidateSize());const sb=supabase.createClient(URL,KEY,{auth:{persistSession:false}});let watch=null,myId=localStorage.getItem('fireVehicleId')||crypto.randomUUID(),myData=JSON.parse(localStorage.getItem('fireVehicleData')||'null'),markers=new Map();localStorage.setItem('fireVehicleId',myId);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function inside(a,b){return BOUNDS.contains([a,b])}function age(t){let s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));return s<60?s+' s temu':Math.floor(s/60)+' min temu'}function icon(t){let c={GBA:'#ef4444',GCBA:'#991b1b',SD:'#f59e0b',SLRt:'#3b82f6',SLOp:'#8b5cf6'}[t]||'#64748b';return L.divIcon({className:'',html:`<div style="width:30px;height:30px;border-radius:50%;background:${c};border:3px solid white;display:grid;place-items:center;box-shadow:0 1px 8px #000">🚒</div>`,iconSize:[30,30],iconAnchor:[15,15]})}async function refresh(){let cutoff=new Date(Date.now()-MAX).toISOString(),{data,error}=await sb.from('vehicles').select('*').gte('updated_at',cutoff).order('updated_at',{ascending:false});if(error)return console.error(error);data=(data||[]).filter(v=>inside(v.lat,v.lng));let active=new Set(data.map(v=>v.id));for(let v of data){let m=markers.get(v.id);if(!m){m=L.marker([v.lat,v.lng],{icon:icon(v.vehicle_type)}).addTo(map);markers.set(v.id,m)}else m.setLatLng([v.lat,v.lng]);m.bindPopup(`<b>${esc(v.unit_name)}</b><br>${esc(v.call_sign)} · ${esc(v.vehicle_type)}<br><small>${age(v.updated_at)}</small>`)}for(let [id,m] of markers)if(!active.has(id)){map.removeLayer(m);markers.delete(id)}$('count').textContent='('+data.length+')';$('vehicles').innerHTML=data.length?data.map(v=>`<div class="vehicle"><b>${esc(v.call_sign)} · ${esc(v.vehicle_type)}</b><br><span class="muted">${esc(v.unit_name)} · ${age(v.updated_at)}</span></div>`).join(''):'Brak aktywnych pojazdów.'}async function init(){let {error}=await sb.from('vehicles').select('id').limit(1);if(error){$('status').textContent='błąd';$('server').innerHTML='<span class="err">'+esc(error.message)+'</span>';return}$('status').textContent='online';$('server').innerHTML='<span class="ok">Supabase połączony.</span>';await refresh();sb.channel('vehicles-live').on('postgres_changes',{event:'*',schema:'public',table:'vehicles'},refresh).subscribe();setInterval(refresh,30000)}async function send(pos){if(!myData)return;let lat=pos.coords.latitude,lng=pos.coords.longitude;if(!inside(lat,lng)){$('mine').innerHTML='<span class="warn">Poza dozwolonym obszarem.</span>';return}let p={id:myId,unit_name:myData.unit,call_sign:myData.call,vehicle_type:myData.type,lat,lng,accuracy:Math.round(pos.coords.accuracy||0),updated_at:new Date().toISOString()},{error}=await sb.from('vehicles').upsert(p,{onConflict:'id'});if(error){$('mine').innerHTML='<span class="err">'+esc(error.message)+'</span>';return}$('mine').innerHTML=`<b>${esc(myData.call)} · ${esc(myData.type)}</b><br>${esc(myData.unit)}<br><span class="ok">GPS aktywny</span> · ~${p.accuracy} m`}function start(){let unit=$('unit').value.trim(),call=$('call').value.trim(),type=$('type').value;if(!unit||!call){$('msg').textContent='Uzupełnij nazwę jednostki i numer operacyjny.';return}myData={unit,call,type};localStorage.setItem('fireVehicleData',JSON.stringify(myData));watch=navigator.geolocation.watchPosition(send,e=>$('mine').innerHTML='<span class="err">GPS: '+esc(e.message)+'</span>',{enableHighAccuracy:true,maximumAge:3000,timeout:15000});$('join').disabled=true;$('stop').disabled=false;$('dlg').close()}$('join').onclick=()=>{if(myData){$('unit').value=myData.unit||'';$('call').value=myData.call||'';$('type').value=myData.type||'GBA'}$('dlg').showModal()};$('cancel').onclick=()=>$('dlg').close();$('go').onclick=start;$('stop').onclick=async()=>{if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;await sb.from('vehicles').delete().eq('id',myId);$('join').disabled=false;$('stop').disabled=true;$('mine').textContent='Udostępnianie zatrzymane.';refresh()};init()})();</script></body></html>
