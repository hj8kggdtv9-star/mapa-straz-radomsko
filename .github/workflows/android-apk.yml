name: FIREMAP Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firemap-android/**'
      - '*.html'
      - '*.js'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'firemap-android/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firemap-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle terminal and offline assets
        run: python3 scripts/bundle_web.py
      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FIREMAP-Zastep-debug-apk
          path: firemap-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
