<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><title>FIREMAP — SK KP PSP Radomsko</title><style>*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#07111f;color:#fff}#app{display:grid;grid-template-columns:360px 1fr}.panel{background:#0a1626;border-right:1px solid #334155;padding:15px;overflow:auto}.logo{font-size:24px;font-weight:900;letter-spacing:.7px}.sub{color:#94a3b8;font-size:12px;margin-bottom:16px}.card{background:#111e30;border:1px solid #334155;border-radius:15px;padding:13px;margin-bottom:12px}.card h3{margin:0 0 8px}.vehicle{padding:9px;border-radius:11px;background:#0b1727;margin:7px 0;border:1px solid #26364b;cursor:pointer}.vehicle small{display:block;color:#94a3b8;margin-top:3px}button,input,select{width:100%;min-height:43px;border-radius:10px;font-size:14px}button{border:0;background:#dc2626;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}button.secondary{background:#334155}input,select{background:#091525;border:1px solid #475569;color:#fff;padding:0 10px;margin-top:6px}#map{height:100%;width:100%}.login{position:fixed;z-index:2000;inset:0;background:#06101def;display:grid;place-items:center}.loginBox{width:min(420px,92vw);background:#0b1727;border:1px solid #334155;border-radius:18px;padding:22px;box-shadow:0 30px 80px #000b}.loginBox h1{margin:0}.loginBox p{color:#94a3b8}.err{color:#fca5a5;font-size:13px;margin-top:8px}.vehicleIcon{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:16px;box-shadow:0 3px 12px #0008}.pulseAmber{animation:pulseAmber 1.7s infinite}.pulseRed{animation:pulseRed 1.25s infinite}.pulseBlue{animation:pulseBlue 1.8s infinite}@keyframes pulseAmber{50%{box-shadow:0 0 0 10px #f59e0b00}}@keyframes pulseRed{50%{box-shadow:0 0 0 12px #ef444400}}@keyframes pulseBlue{50%{box-shadow:0 0 0 10px #3b82f600}}.incidentIcon{width:40px;height:40px;border-radius:50%;border:3px solid white;display:grid;place-items:center;font-size:20px}.fire{background:#dc2626}.mz{background:#f59e0b;color:#111827}.activeIncident{padding:9px;border:1px solid #334155;border-radius:11px;background:#0b1727;margin:7px 0}.activeIncident small{display:block;color:#94a3b8;margin:3px 0}.crosshair{cursor:crosshair!important}.searchResults{margin-top:7px;display:grid;gap:6px}.searchResult{background:#16253a;border:1px solid #334155;border-radius:10px;padding:9px 10px;cursor:pointer;font-size:12px;line-height:1.3}.searchResult:hover{background:#1d3048}.searchHint{font-size:11px;color:#94a3b8;margin:6px 0 0}.searchState{font-size:12px;color:#cbd5e1;margin-top:6px}@media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:45% 55%}.panel{order:2;border-right:0;border-top:1px solid #334155}#map{order:1}}</style></head><body><div class="login" id="login"><div class="loginBox"><h1>FIREMAP</h1><p>SK KP PSP Radomsko</p><input type="password" id="password" placeholder="Hasło dyżurnego"><button id="loginBtn">Zaloguj</button><div class="err" id="loginErr"></div></div></div><div id="app"><aside class="panel"><div class="logo">FIREMAP</div><div class="sub">Stanowisko Kierowania KP PSP Radomsko</div><div class="card"><h3>Zdarzenie</h3><select id="kind"><option value="FIRE">🔥 Pożar</option><option value="MZ">⚠️ Miejscowe zagrożenie</option></select><input id="address" placeholder="Adres, np. Przedbórz, Kwiatowa 31"><button class="secondary" id="searchAddress">🔎 Wyszukaj adres</button><div id="searchState" class="searchState"></div><div id="searchResults" class="searchResults"></div><div class="searchHint">Po wybraniu wyniku współrzędne zostaną uzupełnione automatycznie.</div><input id="coords" placeholder="51.06700, 19.44500"><input id="desc" placeholder="Opis zdarzenia (opcjonalnie)"><button id="addCoords">Dodaj z koordynatów</button><button class="secondary" id="pickMap">Wskaż punkt na mapie</button></div><div class="card"><h3>Aktywne zdarzenia</h3><div id="incidents"></div></div><div class="card"><h3>Zastępy <span id="count">(0)</span></h3><div id="vehicles"></div></div><button class="secondary" id="logout">Wyloguj</button></aside><div id="map"></div></div><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(()=>{const URL='https://vqgipvwcvbhabvfipodl.supabase.co',KEY='sb_publishable_BYEVImorGhltw1aCaRXyRQ_pM2hKMkI',EMAIL='sk@firemap.local',BOUNDS=L.latLngBounds([[50.58,18.55],[51.55,20.48]]),$=id=>document.getElementById(id),sb=supabase.createClient(URL,KEY),map=L.map('map',{maxBounds:BOUNDS.pad(.08),minZoom:8}).setView([51.067,19.445],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);let vMarkers=new Map(),iMarkers=new Map(),pickMode=false,searchMarker=null;const STATUS={BASE:{label:'W bazie',color:'#64748b',cls:''},DISPATCHED:{label:'Wyjazd do akcji',color:'#f59e0b',cls:'pulseAmber'},ON_SCENE:{label:'Na miejscu',color:'#dc2626',cls:'pulseRed'},RETURNING:{label:'Zakończenie działań',color:'#2563eb',cls:'pulseBlue'}},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),age=t=>{let s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));return s<60?s+' s temu':s<3600?Math.floor(s/60)+' min temu':Math.floor(s/3600)+' h temu'};function vIcon(v){let s=STATUS[v.status]||STATUS.BASE;return L.divIcon({className:'',html:`<div class="vehicleIcon ${s.cls}" style="background:${s.color}">🚒</div>`,iconSize:[38,38],iconAnchor:[19,19]})}function iIcon(k){return L.divIcon({className:'',html:`<div class="incidentIcon ${k==='FIRE'?'fire':'mz'}">${k==='FIRE'?'🔥':'⚠️'}</div>`,iconSize:[44,44],iconAnchor:[22,22]})}async function refreshVehicles(){let {data,error}=await sb.from('vehicles').select('*').order('updated_at',{ascending:false});if(error)return;let seen=new Set();data=(data||[]).filter(v=>BOUNDS.contains([v.lat,v.lng]));data.forEach(v=>{seen.add(v.id);let m=vMarkers.get(v.id);if(!m){m=L.marker([v.lat,v.lng],{icon:vIcon(v)}).addTo(map);vMarkers.set(v.id,m)}else{m.setLatLng([v.lat,v.lng]);m.setIcon(vIcon(v))}let s=STATUS[v.status]||STATUS.BASE;m.bindPopup(`<b>${esc(v.call_sign)} · ${esc(v.vehicle_type)}</b><br>${esc(v.unit_name)}<br>Status: <b>${s.label}</b><br>Ostatnio: ${age(v.updated_at)}`)});for(let[id,m]of vMarkers)if(!seen.has(id)){map.removeLayer(m);vMarkers.delete(id)}$('count').textContent='('+data.length+')';$('vehicles').innerHTML=data.map(v=>{let s=STATUS[v.status]||STATUS.BASE;return `<div class="vehicle" data-id="${v.id}"><b><span style="color:${s.color}">●</span> ${esc(v.call_sign)} · ${esc(v.vehicle_type)}</b><small>${esc(v.unit_name)} · ${s.label} · ${age(v.updated_at)}</small></div>`}).join('')||'<small>Brak pojazdów.</small>';document.querySelectorAll('.vehicle[data-id]').forEach(el=>el.onclick=()=>{let m=vMarkers.get(el.dataset.id);if(m){map.flyTo(m.getLatLng(),14);m.openPopup()}})}async function refreshIncidents(){let {data,error}=await sb.from('incidents').select('*').eq('active',true).order('created_at',{ascending:false});if(error)return;let seen=new Set();(data||[]).forEach(i=>{seen.add(i.id);let m=iMarkers.get(i.id);if(!m){m=L.marker([i.lat,i.lng],{icon:iIcon(i.kind),zIndexOffset:1000}).addTo(map);iMarkers.set(i.id,m)}else m.setLatLng([i.lat,i.lng]);m.bindPopup(`<b>${i.kind==='FIRE'?'🔥 POŻAR':'⚠️ MZ'}</b><br>${esc(i.description||'Bez opisu')}<br>${i.lat.toFixed(5)}, ${i.lng.toFixed(5)}`)});for(let[id,m]of iMarkers)if(!seen.has(id)){map.removeLayer(m);iMarkers.delete(id)}$('incidents').innerHTML=(data||[]).map(i=>`<div class="activeIncident"><b>${i.kind==='FIRE'?'🔥 POŻAR':'⚠️ MZ'}</b><small>${esc(i.description||'Bez opisu')}<br>${i.lat.toFixed(5)}, ${i.lng.toFixed(5)}</small><button class="secondary closeInc" data-id="${i.id}">Zakończ / usuń</button></div>`).join('')||'<small>Brak aktywnych zdarzeń.</small>';document.querySelectorAll('.closeInc').forEach(b=>b.onclick=async()=>{await sb.from('incidents').update({active:false,updated_at:new Date().toISOString()}).eq('id',b.dataset.id);refreshIncidents()})}function parseCoords(s){let p=s.trim().replace(';',',').split(',').map(x=>Number(x.trim()));return p.length===2&&p.every(Number.isFinite)?p:null}async function addIncident(lat,lng){let kind=$('kind').value,description=$('desc').value.trim()||$('address').value.trim();let {error}=await sb.from('incidents').insert({kind,lat,lng,description});if(error)return alert(error.message);$('coords').value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;refreshIncidents()}$('addCoords').onclick=()=>{let p=parseCoords($('coords').value);if(!p)return alert('Wpisz koordynaty w formacie: 51.067, 19.445');addIncident(p[0],p[1])};$('pickMap').onclick=()=>{pickMode=!pickMode;map.getContainer().classList.toggle('crosshair',pickMode);$('pickMap').textContent=pickMode?'Kliknij miejsce na mapie…':'Wskaż punkt na mapie'};map.on('click',e=>{if(!pickMode)return;pickMode=false;map.getContainer().classList.remove('crosshair');$('pickMap').textContent='Wskaż punkt na mapie';$('coords').value=`${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;addIncident(e.latlng.lat,e.latlng.lng)});async function geocodeAddress(){const q=$('address').value.trim();if(q.length<3){$('searchState').textContent='Wpisz co najmniej 3 znaki.';return}$('searchState').textContent='Wyszukiwanie…';$('searchResults').innerHTML='';try{const viewbox=`${BOUNDS.getWest()},${BOUNDS.getNorth()},${BOUNDS.getEast()},${BOUNDS.getSouth()}`;const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=pl&accept-language=pl&bounded=1&viewbox=${encodeURIComponent(viewbox)}&q=${encodeURIComponent(q)}`;const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.length){$('searchState').textContent='Nie znaleziono adresu w obszarze FIREMAP.';return}$('searchState').textContent=`Znaleziono: ${data.length}. Wybierz właściwy wynik.`;$('searchResults').innerHTML=data.map((x,i)=>`<div class="searchResult" data-i="${i}">${esc(x.display_name)}</div>`).join('');document.querySelectorAll('.searchResult').forEach(el=>el.onclick=()=>{const x=data[Number(el.dataset.i)],lat=Number(x.lat),lng=Number(x.lon);$('coords').value=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;if(!$('desc').value.trim())$('desc').value=x.display_name;map.flyTo([lat,lng],16,{duration:.7});if(searchMarker)map.removeLayer(searchMarker);searchMarker=L.circleMarker([lat,lng],{radius:9,color:'#2563eb',weight:4,fillColor:'#fff',fillOpacity:.8}).addTo(map).bindPopup(`<b>Wyszukany adres</b><br>${esc(x.display_name)}`).openPopup();$('searchResults').innerHTML='';$('searchState').textContent='Adres wybrany — współrzędne uzupełnione.'})}catch(e){console.error(e);$('searchState').textContent='Nie udało się wyszukać adresu. Spróbuj ponownie lub wskaż punkt na mapie.'}}$('searchAddress').onclick=geocodeAddress;$('address').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();geocodeAddress()}});async function logged(){let {data}=await sb.auth.getSession();if(data.session){$('login').style.display='none';start()}}$('loginBtn').onclick=async()=>{let password=$('password').value,{error}=await sb.auth.signInWithPassword({email:EMAIL,password});if(error){$('loginErr').textContent='Błędne hasło lub konto SK nie jest jeszcze skonfigurowane.';return}$('login').style.display='none';start()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};let started=false;function start(){if(started)return;started=true;refreshVehicles();refreshIncidents();sb.channel('sk-live').on('postgres_changes',{event:'*',schema:'public',table:'vehicles'},refreshVehicles).on('postgres_changes',{event:'*',schema:'public',table:'incidents'},refreshIncidents).subscribe();setInterval(refreshVehicles,30000);setInterval(refreshIncidents,30000);setTimeout(()=>map.invalidateSize(),150)}logged()})();</script></body></html>
